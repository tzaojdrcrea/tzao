<!DOCTYPE html>
<html lang="fr" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tzao 3.0 — Accès réservé</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Charm:wght@400;700&display=swap">
<style>
html{-webkit-text-size-adjust:100%; text-size-adjust:100%;}
*{box-sizing:border-box;margin:0;padding:0;}
body{
  min-height:100vh; display:flex; align-items:center; justify-content:center;
  font-family:"Charm","Segoe Script",cursive; color:#3A2D1E;
  background:
    radial-gradient(ellipse at 15% 8%, rgba(110,82,44,.07), transparent 55%),
    radial-gradient(ellipse at 85% 92%, rgba(110,82,44,.06), transparent 55%),
    repeating-linear-gradient(93deg, rgba(110,82,44,.022) 0 2px, transparent 2px 7px),
    #EFE2C4;
}
.porte{
  max-width:420px; width:92%; text-align:center; padding:34px 26px;
  border:2px solid #6E522C; border-radius:8px; background:#F8EFD9;
  box-shadow:0 4px 24px rgba(58,45,30,.15);
}
h1{font-size:2rem; font-weight:700; margin-bottom:4px;}
h1 .k{color:#A5361F;}
.sous{color:#7C6848; font-size:1rem; margin-bottom:22px;}
input[type=password]{
  font:inherit; font-size:1.1rem; padding:10px 14px; width:100%;
  border:1px solid #D8C69E; border-radius:6px; background:#fffdf6; color:#3A2D1E;
  text-align:center;
}
label{display:block; margin:12px 0; font-size:.95rem; color:#7C6848;}
button{
  font:inherit; font-weight:700; font-size:1.1rem; margin-top:6px;
  padding:10px 30px; border:1px solid #6E522C; border-radius:6px;
  background:#6E522C; color:#F8EFD9; cursor:pointer;
}
button:disabled{opacity:.5;}
.err{color:#A5361F; min-height:1.3em; margin-top:10px; font-size:.95rem;}
.sceau{
  width:54px; height:54px; border:3px solid #A5361F; border-radius:8px; color:#A5361F;
  display:flex; align-items:center; justify-content:center; margin:0 auto 14px;
  font-weight:700; transform:rotate(6deg); font-size:1.4rem;
}
</style>
</head>
<body>
<div class="porte">
  <div class="sceau">創</div>
  <h1>Tzao <span class="k">3.0</span></h1>
  <div class="sous">Créateur de personnage — accès réservé aux joueurs</div>
  <input type="password" id="mdp" placeholder="Mot de passe" autocomplete="current-password">
  <label><input type="checkbox" id="souvenir" checked> se souvenir de moi sur cet appareil</label>
  <button id="entrer">Entrer</button>
  <div class="err" id="err"></div>
</div>

const b64 = s => Uint8Array.from(atob(s), c=>c.charCodeAt(0));
async function deriver(mdp, salt){
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(mdp), "PBKDF2", false, ["deriveKey"]);
  return crypto.subtle.deriveKey({name:"PBKDF2", salt, iterations:300000, hash:"SHA-256"}, base,
    {name:"AES-GCM", length:256}, false, ["decrypt"]);
}
async function ouvrir(mdp, silencieux){
  const btn = document.getElementById("entrer"), err = document.getElementById("err");
  btn.disabled = true; if(!silencieux) err.textContent = "Ouverture…";
  try{
    const cle = await deriver(mdp, b64(PAYLOAD.salt));
    const clair = await crypto.subtle.decrypt({name:"AES-GCM", iv:b64(PAYLOAD.iv)}, cle, b64(PAYLOAD.ct));
    if(document.getElementById("souvenir").checked){
      try{ localStorage.setItem("tzao-sesame", mdp); }catch(e){}
    }
    const html = new TextDecoder().decode(clair);
    document.open(); document.write(html); document.close();
  }catch(e){
    btn.disabled = false;
    try{ localStorage.removeItem("tzao-sesame"); }catch(e2){}
    err.textContent = silencieux ? "" : "Mot de passe incorrect.";
  }
}
document.getElementById("entrer").onclick = ()=>ouvrir(document.getElementById("mdp").value, false);
document.getElementById("mdp").addEventListener("keydown", e=>{ if(e.key==="Enter") ouvrir(e.target.value, false); });
try{
  const m = localStorage.getItem("tzao-sesame");
  if(m) ouvrir(m, true);
}catch(e){}
